# LocalExecutor only. Bind the API to loopback. Memory caps stay under 2.5 GB.
# Log driver is the daemon default (local on the Droplet). Do not set one here.
name: lft-airflow

x-airflow: &airflow
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  image: lft-airflow:local
  env_file: ${AIRFLOW_ENV_FILE:-/etc/lft-pipelines/airflow.env}
  entrypoint: ["/bin/bash", "/opt/airflow/entrypoint.sh"]
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://api-server:8080/execution/
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:ADMIN"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
    AIRFLOW__API__HOST: 0.0.0.0
    AIRFLOW__API__PORT: "8080"
    AIRFLOW__API__WORKERS: "1"
    _AIRFLOW_DB_MIGRATE: "true"
  volumes:
    - ./entrypoint.sh:/opt/airflow/entrypoint.sh:ro
    - airflow-logs:/opt/airflow/logs
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD via docker compose --env-file}
    volumes:
      - airflow-pg:/var/lib/postgresql/data
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="postgresql+psycopg2://airflow:$${POSTGRES_PASSWORD}@postgres/airflow"
        airflow db migrate
        airflow pools set lft_db 1 "one database query at a time"
    restart: "no"
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy

  api-server:
    <<: *airflow
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 512m
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  scheduler:
    <<: *airflow
    command: scheduler
    mem_limit: 1g
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dag-processor:
    <<: *airflow
    command: dag-processor
    mem_limit: 384m
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-pg:
  airflow-logs:
